name: CI

# Chạy khi push lên nhánh chính và khi mở pull request — bắt lỗi TRƯỚC khi merge.
on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Bỏ test_cp5.py (gọi vào bản deploy đang sống) và test_bonus_cicd.py
      # (kiểm tra badge của chính workflow này — tự tham chiếu vòng tròn).
      - name: Run checkpoint tests
        env:
          API_TOKEN: ci-dummy
          REDIS_URL: 'fake://'
        run: pytest tests/ -v --ignore=tests/test_cp5.py --ignore=tests/test_bonus_cicd.py

  build:
    name: Build image
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t day12-chat:ci .

      - name: Smoke test image
        run: |
          docker run -d --name ci-check \
            -e PORT=8000 -e API_TOKEN=ci-dummy \
            -p 8000:8000 day12-chat:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/healthz && break
            sleep 2
          done
          curl -fsS http://localhost:8000/healthz
          docker rm -f ci-check

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [test, build]
    # needs: đợi test và build xanh. if: chỉ deploy từ nhánh chính,
    # mở pull request không kéo theo một lần deploy.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger Render deploy hook
        env:
          DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl -fsS -X POST "$DEPLOY_HOOK_URL"

      - name: Smoke test deployment
        if: vars.PUBLIC_URL != ''
        run: |
          sleep 45
          curl -fsS "${{ vars.PUBLIC_URL }}/healthz"
